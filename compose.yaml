services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coachconnect-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,nosuid,size=128m,uid=1000,gid=1000
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
